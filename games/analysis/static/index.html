<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlobeRunners — Game analysis</title>
<link rel="stylesheet" href="/style.css?v=1" />
</head>
<body>
<header class="topbar">
  <div class="brand">🌍 GlobeRunners <span class="sub">game analysis</span></div>
  <div class="controls">
    <label for="gameSelect">Game:</label>

  <p class="loading">Loading games…</p>
</main>

<script src="/app.js?v=1"></script>
</body>
</html>
